<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Sendry</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Sendry</h1>
    <label class="switch" title="Tüm sitelerde aç/kapat">
      <input id="enabled-toggle" type="checkbox" />
      <span class="slider"></span>
    </label>
  </header>

  <section class="card site-card">
    <span id="current-site" class="site">-</span>
    <span id="site-status" class="status"></span>
    <button id="site-toggle-btn" class="small-btn"></button>
  </section>

  <section class="card">
    <h2>Bugün</h2>
    <div class="stats">
      <div class="stat"><span id="stat-checked" class="num">0</span><span class="lbl">kontrol</span></div>
      <div class="stat"><span id="stat-blocked" class="num warn">0</span><span class="lbl">durduruldu</span></div>
      <div class="stat"><span id="stat-fixed" class="num ok">0</span><span class="lbl">düzeltildi</span></div>
      <div class="stat"><span id="stat-bypassed" class="num">0</span><span class="lbl">yine de</span></div>
    </div>
    <ul id="detector-list" class="detector-list"></ul>
    <p id="empty-state" class="empty-state" hidden>Bugün yakalanan bir sorun yok.</p>
  </section>

  <footer>
    <button id="open-options">Ayarlar ve metin testi</button>
  </footer>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
