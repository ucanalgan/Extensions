<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Sendry</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="top">
    <img src="icons/icon48.png" width="26" height="26" alt="" />
    <b class="display">Sendry</b>
    <label class="switch" title="Tüm sitelerde aç/kapat">
      <input id="enabled-toggle" type="checkbox" aria-label="Sendry'yi çalıştır" />
      <span></span>
    </label>
  </div>

  <div class="site-row">
    <span id="current-site" class="host">-</span>
    <span id="site-status" class="st"></span>
    <button id="site-toggle-btn" class="btn link" type="button"></button>
  </div>

  <div class="today">
    <p id="summary"></p>
    <dl>
      <div><dt>Durduruldu</dt><dd id="stat-blocked">0</dd></div>
      <div><dt>Düzeltildi</dt><dd id="stat-fixed">0</dd></div>
      <div><dt>Yine de</dt><dd id="stat-bypassed">0</dd></div>
    </dl>
  </div>

  <ul id="detector-list" class="top-list"></ul>

  <div class="foot">
    <span id="checked-note"></span>
    <button id="open-options" class="btn link" type="button">Ayarlar</button>
  </div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
